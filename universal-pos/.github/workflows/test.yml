name: PHP lint and domain tests
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Lint PHP files
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Domain tests
        run: php tests/domain_test.php

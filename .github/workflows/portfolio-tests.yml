name: Portfolio checks
on: [push, pull_request]
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
      - name: All PHP applications syntax
        run: |
          for folder in universal-pos smart-inventory angola-payroll business-finance-360; do
            find "$folder" -name '*.php' -print0 | xargs -0 -n1 php -l
          done
      - name: All PHP domain tests
        run: |
          for folder in universal-pos smart-inventory angola-payroll business-finance-360; do
            php "$folder/tests/domain_test.php"
          done
  petrocalc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node petrocalc-engineering/tests/calc.test.cjs
      - run: node petrocalc-engineering/tests/ui_smoke.test.cjs
  excel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python excel-flow-vba/tests/check_workbook.py
      - run: python business-finance-360/tests/check_workbook.py

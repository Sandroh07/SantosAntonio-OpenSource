name: SmartInventory tests
on: [push, pull_request]
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
      - run: find public src scripts tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php tests/domain_test.php
